[project]
name = "claims-process-automation"
version = "0.1.0"
description = "SQL and Python-based process automation project for insurance claims analysis and reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.18.0",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.uv]
package = true